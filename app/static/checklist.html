<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICPPV Checklist</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280;
    --border: #d9dde3; --accent: #2563eb; --danger: #dc2626; --ok: #16a34a;
    --done-bg: #dcfce7; --done-text: #166534;
    --soon-bg: #fef9c3; --soon-text: #854d0e; --soon-border: #eab308;
    --late-bg: #fee2e2; --late-text: #991b1b; --late-border: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --panel: #1d2128; --text: #e6e8eb; --muted: #9aa1ab;
      --border: #333a44; --accent: #60a5fa; --danger: #f87171; --ok: #4ade80;
      --done-bg: #14532d; --done-text: #bbf7d0;
      --soon-bg: #422006; --soon-text: #fde68a; --soon-border: #ca8a04;
      --late-bg: #450a0a; --late-text: #fecaca; --late-border: #ef4444;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .toolbar label { color: var(--muted); font-size: 13px; }
  select { font: inherit; color: var(--text); background: var(--panel);
           border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; min-width: 180px; }
  #progress { color: var(--muted); font-size: 13px; }
  #status { min-height: 1.4em; margin-bottom: 8px; color: var(--danger); }
  section { background: var(--panel); border: 1px solid var(--border);
            border-radius: 8px; padding: 12px; margin-bottom: 16px; }
  h2 { font-size: 15px; margin: 0 0 8px; display: flex; justify-content: space-between; }
  h2 .count { color: var(--muted); font-weight: normal; font-size: 13px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  li { display: flex; gap: 6px; align-items: stretch; }
  li button.item { flex: 1; min-width: 0; text-align: left; font: inherit; color: var(--text);
              background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
              padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
  li button:hover { border-color: var(--accent); }
  li button.item::before { content: ""; flex: none; width: 16px; height: 16px;
                      border: 2px solid var(--border); border-radius: 4px; }
  li button.done { background: var(--done-bg); color: var(--done-text); border-color: var(--ok); }
  li button.item.done::before { content: "✓"; border-color: var(--ok); background: var(--ok);
                           color: var(--panel); font-size: 12px; line-height: 12px; text-align: center; }
  li button.done .desc { text-decoration: line-through; }
  li button .due { margin-left: auto; flex: none; font-variant-numeric: tabular-nums; opacity: .75; }
  li button .due s { opacity: .7; margin-right: 4px; }
  /* Snooze buttons beside a pending item with a time. */
  li button.snooze { flex: none; font: inherit; font-size: 13px; color: var(--text); background: var(--panel);
                     border: 1px solid var(--border); border-radius: 6px; padding: 0 10px; cursor: pointer; }
  /* Not done yet and due within 5 minutes / past its time. */
  li button.due-soon { background: var(--soon-bg); color: var(--soon-text); border-color: var(--soon-border); }
  li button.overdue { background: var(--late-bg); color: var(--late-text); border-color: var(--late-border); }
  li button.item.due-soon::before { border-color: var(--soon-border); }
  li button.item.overdue::before { border-color: var(--late-border); }
  li button:disabled { opacity: .6; cursor: progress; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>ICPPV Checklist</h1>
    <span id="progress"></span>
  </header>
  <div class="toolbar">
    <label for="type">Checklist</label>
    <select id="type"><option value="">All</option></select>
  </div>
  <div id="status"></div>
  <div id="groups"><p class="muted">Loading…</p></div>
</main>

<script>
const groupsEl = document.getElementById("groups");
const statusEl = document.getElementById("status");
const progressEl = document.getElementById("progress");
const typeEl = document.getElementById("type");
let allItems = [];
let items = [];
let pendingToggles = 0;

// The selected checklist is kept in the URL (?type=...) so it survives reloads and can be bookmarked.
function selectedType() { return new URLSearchParams(location.search).get("type") || ""; }

function renderTypeOptions() {
  const current = selectedType();
  const types = [...new Set(allItems.map(i => i.type))].sort((a, b) => a.localeCompare(b));
  typeEl.replaceChildren(new Option("All", ""), ...types.map(t => new Option(t, t)));
  typeEl.value = types.includes(current) ? current : "";
}

function applyFilter() {
  const type = typeEl.value;
  items = type ? allItems.filter(i => i.type === type) : allItems;
  render();
}

typeEl.addEventListener("change", () => {
  const url = new URL(location.href);
  if (typeEl.value) url.searchParams.set("type", typeEl.value);
  else url.searchParams.delete("type");
  history.replaceState(null, "", url);
  applyFilter();
});

function setStatus(msg) { statusEl.textContent = msg || ""; }

async function api(path, options = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

function render() {
  const done = items.filter(i => i.activated).length;
  progressEl.textContent = items.length ? `${done} / ${items.length} done` : "";
  if (!items.length) {
    groupsEl.innerHTML = '<p class="muted">No active items.</p>';
    return;
  }

  const shifts = snoozeShifts();
  const byGroup = new Map();
  for (const item of items) {
    if (!byGroup.has(item.group)) byGroup.set(item.group, []);
    byGroup.get(item.group).push(item);
  }

  groupsEl.replaceChildren();
  // Groups appear in the order of their first item in the checklist order.
  for (const group of byGroup.keys()) {
    const groupItems = byGroup.get(group);
    const section = document.createElement("section");
    const h2 = document.createElement("h2");
    h2.textContent = group;
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = `${groupItems.filter(i => i.activated).length} / ${groupItems.length}`;
    h2.append(count);

    const ul = document.createElement("ul");
    for (const item of groupItems) {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = item.activated ? "item done" : "item";
      btn.setAttribute("aria-pressed", item.activated);
      const shift = shifts.get(item.id);
      const dueAt = item.time && shiftedTime(item.time, shift);
      if (item.time) {
        btn.dataset.time = dueAt;
        btn.title = shift ? `Due at ${item.time}, snoozed to ${dueAt}` : `Due at ${item.time}`;
      }
      const text = document.createElement("span");
      text.className = "desc";
      text.textContent = item.description;
      btn.append(text);
      if (item.time) {
        const due = document.createElement("span");
        due.className = "due";
        if (shift) {
          const original = document.createElement("s");
          original.textContent = item.time;
          due.append(original, dueAt);
        } else {
          due.textContent = item.time;
        }
        btn.append(due);
      }
      btn.addEventListener("click", () => toggle(item, btn));
      li.append(btn);
      if (item.time && !item.activated) {
        li.append(snoozeButton(item, `+${SNOOZE_STEP_MIN}`, `Snooze ${SNOOZE_STEP_MIN} more minutes`,
                               item.snooze + SNOOZE_STEP_MIN));
        if (item.snooze) li.append(snoozeButton(item, "↺", "Undo this item's snooze", 0));
      }
      ul.append(li);
    }
    section.append(h2, ul);
    groupsEl.append(section);
  }
  updateDueColors();
}

// Colors pending items by their "HH:MM" time against this device's clock:
// yellow from 5 minutes before the time, red once the time is reached.
const DUE_SOON_SECONDS = 5 * 60;
function updateDueColors() {
  const now = new Date();
  const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  for (const btn of groupsEl.querySelectorAll("button.item[data-time]")) {
    const [h, m] = btn.dataset.time.split(":").map(Number);
    const dueSec = h * 3600 + m * 60;
    const pending = !btn.classList.contains("done");
    btn.classList.toggle("overdue", pending && nowSec >= dueSec);
    btn.classList.toggle("due-soon", pending && nowSec >= dueSec - DUE_SOON_SECONDS && nowSec < dueSec);
  }
}
setInterval(updateDueColors, 5000);

async function toggle(item, btn) {
  btn.disabled = true;
  pendingToggles++;
  try {
    const updated = await api(`/items/${item.id}/activated`, {
      method: "PUT",
      body: JSON.stringify({ activated: !item.activated }),
    });
    Object.assign(item, updated);
    setStatus("");
    render();
  } catch (e) {
    if (e.message.startsWith("404")) {
      // Item was deleted or set inactive meanwhile: drop it from the list.
      setStatus("");
      load();
      return;
    }
    setStatus(`Could not update "${item.description}": ${e.message}`);
    btn.disabled = false;
  } finally {
    pendingToggles--;
  }
}

// Snoozing postpones an item and every item of its checklist with a later time (the stored
// times don't change): each tap adds SNOOZE_STEP_MIN minutes to the item's own snooze, and
// "↺" drops it. An item is pushed back by its own snooze plus those of every item of the
// same type whose stored time is earlier; items at the same time don't shift each other.
const SNOOZE_STEP_MIN = 5;

// Minutes each item with a time is pushed back, by id.
function snoozeShifts() {
  const shifts = new Map();
  for (const item of allItems) {
    if (!item.time) continue;
    let total = item.snooze ?? 0;
    for (const other of allItems) {
      if (other.type === item.type && other.time && other.time < item.time) total += other.snooze ?? 0;
    }
    shifts.set(item.id, total);
  }
  return shifts;
}

// "HH:MM" pushed back by some minutes.
function shiftedTime(time, minutes) {
  const [h, m] = time.split(":").map(Number);
  const total = (h * 60 + m + minutes) % (24 * 60);
  return `${String(Math.floor(total / 60)).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`;
}

function snoozeButton(item, label, title, snooze) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "snooze";
  btn.textContent = label;
  btn.title = title;
  btn.setAttribute("aria-label", `${title}: ${item.description}`);
  btn.addEventListener("click", () => setSnooze(item, btn, snooze));
  return btn;
}

async function setSnooze(item, btn, snooze) {
  btn.disabled = true;
  pendingToggles++;
  try {
    const updated = await api(`/items/${item.id}/snooze`, {
      method: "PUT",
      body: JSON.stringify({ snooze }),
    });
    Object.assign(item, updated);
    setStatus("");
    render();
  } catch (e) {
    if (e.message.startsWith("404")) {
      setStatus("");
      load();
      return;
    }
    setStatus(`Could not snooze "${item.description}": ${e.message}`);
    btn.disabled = false;
  } finally {
    pendingToggles--;
  }
}

async function load() {
  try {
    allItems = await api("/items?active=true");
    // Checklist order: by time, then by sequence (items without either last), then by id.
    allItems.sort((a, b) =>
      (a.time === null) - (b.time === null) || (a.time ?? "").localeCompare(b.time ?? "") ||
      (a.sequence ?? Infinity) - (b.sequence ?? Infinity) || a.id - b.id);
    setStatus("");
    renderTypeOptions();
    applyFilter();
  } catch (e) {
    setStatus(`Could not load items: ${e.message}`);
  }
}

// Keep the list current with edits made elsewhere (e.g. an item set inactive in /admin):
// refresh every 30 s and whenever the page becomes visible again.
const REFRESH_MS = 30000;
function refresh() {
  if (document.visibilityState === "visible" && pendingToggles === 0) load();
}
setInterval(refresh, REFRESH_MS);
document.addEventListener("visibilitychange", refresh);

load();
</script>
</body>
</html>
